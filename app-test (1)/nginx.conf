# /etc/nginx/conf.d/default.conf (This file will be included in the http block)

server {
    listen 8080; # Cloud Run expects your app to listen on 8080
    server_name localhost; # Or your Cloud Run service URL if you want to be specific

    # Root directory for your React app's build files
    root /usr/share/nginx/html;

    # Try serving files directly, then fall back to index.html for React Router
    location / {
        try_files $uri $uri/ /index.html;

        # --- Configure Security Headers Here ---
        add_header Content-Security-Policy "frame-ancestors 'self' https://your-embedding-domain.com;";
        # --- End Security Header Configuration ---
    }

    # Optional: Handle 404 errors by redirecting to index.html
    error_page 404 /index.html;
    location = /index.html {
        internal;
    }
}